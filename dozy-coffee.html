<!doctype html>
<html lang="ko">
  <head>

    <title>Dozy Coffee | 도윤혁 Portfolio</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="detail.css" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <script src="header.js"></script>
    <script src="footer.js"></script>
  </head>
  <body>
    <site-header></site-header>

    <main>
      <a class="back-link" href="index.html#projects">← 프로젝트 목록</a>

            <p class="kicker">2인 사이드 프로젝트 · 백엔드</p>
            <h1>Dozy Coffee</h1>
            <p class="empty-desc">아직 작성 중입니다.</p>

            <dl class="meta">

                <dt>담당</dt>

                    </li>
                    <li>
                      <span class="repo-role">인증</span>
                      <a href="https://github.com/dozycoffee/dozy-auth" target="_blank" rel="noopener">dozy-auth</a>
                    </li>
                  </ul>
                </dd>
              </div>
            </dl>
          </div>
